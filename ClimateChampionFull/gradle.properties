# Enable AndroidX and Jetifier
android.useAndroidX=true
android.enableJetifier=true

# Set Java home to Android Studio's bundled JDK (JBR)
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# Gradle daemon memory (fixes "OutOfMemoryError: Java heap space" in :app:packageDebug)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true

# Kotlin Daemon JVM arguments to ensure compatibility
kotlin.daemon.jvm.options=-Xmx2048m
